[package]
name = "jarvis-term"
version = "0.1.0"
edition = "2021"
description = "Full-screen TTY dashboard for the Jarvis server"

[dependencies]
ratatui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
